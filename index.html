<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><title>RepTempo · Entrenador acústico</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="brand">◉ RepTempo</div><p>Tu ritmo. Tus repeticiones. Sin contar.</p></header>
<section class="panel setup" id="setup"><h2>Configura tu entrenamiento</h2><div class="fields"><label>Series<input id="sets" type="number" min="1" max="50" value="1"></label><label>Repeticiones por serie<input id="reps" type="number" min="1" max="200" value="10"></label><label>Apretar · segundos<input id="contract" type="number" min="1" max="120" value="3"></label><label>Aflojar · segundos<input id="release" type="number" min="1" max="120" value="3"></label><label>Entre repeticiones · segundos<input id="gap" type="number" min="0" max="300" value="3"></label><label>Entre series · segundos<input id="rest" type="number" min="0" max="3600" value="45"></label><label>Cuenta atrás inicial · segundos<input id="countdown" type="number" min="0" max="60" value="5"></label><label>Volumen<input id="volume" type="range" min="0" max="100" value="45"></label></div><p class="estimate" id="estimate"></p><button id="start" class="primary">▶ Empezar entrenamiento</button></section>
<section class="panel workout" aria-live="polite"><div class="topline"><span id="seriesLabel">SERIE 1 / 1</span><span id="status">PREPARADO</span></div><div class="count" id="repLabel">0 / 10</div><div class="orb" id="orb"><span id="phase">LISTO</span><strong id="seconds">—</strong></div><p id="hint">Configura y pulsa empezar</p><div class="progress"><div id="progressBar"></div></div><div class="actions"><button id="pause" disabled>⏸ Pausar</button><button id="stop" disabled>■ Detener</button></div><p class="small" id="remaining">Duración estimada: —</p></section><footer>Sonidos generados en tu dispositivo · Sin cuentas ni anuncios</footer></main><script src="app.js"></script></body></html>
